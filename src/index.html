    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css" />
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"/>
        <link rel="icon" type="favicon.ico" href="images_to_do_list\crayon.ico">
         <title>To-do list</title>
    </head>

    
    <body>
        <h1>TO-DO LIST</h1>
        
        <div class="container">

            <div class="writeTaskContainer">
                <input type="text" id="taskinput" placeholder="J'écris ce que je dois faire">
                
            </div>

            <div class="containerFilter">
                <button id="addTaskBtn">Ajouter</button>  
                <button id="button_done">Que me reste-t-il à faire ?</button> 
                <button id="button_undone">Trier ma liste</button>
                <button id="button_all">Afficher tout</button>
            </div>

            <div id="counter">0</div>

            <div id="progressContainer">
                <div id="progressBar"></div>
            </div>

            <ul id="taskList"></ul>
        </div>    
            
    </div>

 
    <footer id="footer">
        <p>&copy; 2025 SBH</p>
        
      </footer>  

    <script src="app.js"></script>
</body>

</html>
