    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css" />
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Playwrite+HU&family=Poppins&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
        <link rel="icon" type="favicon.ico" href="images_to_do_list\crayon.ico">
         <title>La tou-dou liste des enfants</title>
    </head>

    <header>
        <div id ="banniere"></div>
    </header> 
    
    <body>
        <h1>TO-DO LIST</h1>
        
        <div class="container">

            <div class="writeTaskContainer">
                <input type="text" id="taskinput" placeholder="J'écris ce que je dois faire">
                <button id="addTaskBtn">Ajouter</button>  
            </div>

            <div class="containerFilter">
                <button id="button_done">Que me reste-t-il à faire ?</button> 
                <button id="button_undone">Trier ma liste</button>
                
            </div>

            <div id="counter">0</div>

            <div id="progressContainer">
                <div id="progressBar"></div>
            </div>

            <ul id="taskList"></ul>
        </div>    
            
    </div>

 
    <footer id="footer">

      </footer>  

    <script src="app.js"></script>
</body>

</html>
